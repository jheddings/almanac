# Repo tooling for the almanac skills.
#
# Nothing here ships. The plugin payload is metadata, skills, and templates — all
# markdown and JSON — so this project exists only for contributors and CI. It is
# deliberately not a distributable package: `package = false` keeps uv from trying
# to build it, and pytest's `pythonpath` is what makes `tools/` importable.

[project]
name = "almanac-tools"
version = "0.0.0"
description = "Repo tooling for the almanac skills. Not published, not shipped."
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
