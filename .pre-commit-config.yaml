# Configure pre-commit hooks
---
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-case-conflict
          - id: check-merge-conflict
          - id: trailing-whitespace

    - repo: https://github.com/rbubley/mirrors-prettier
      rev: v3.9.6
      hooks:
          - id: prettier

    # These run through `uv run`, which resolves the environment declared in
    # pyproject.toml. `just` is not on the CI image that runs pre-commit, so the hooks
    # call `uv` directly.
    #
    # The manifest hook covers every harness in `harnesses.toml`.
    - repo: local
      hooks:
          - id: plugin-manifests
            name: every harness manifest agrees
            entry: uv run python -m tools check-manifests
            language: system
            pass_filenames: false
            files: ^(?:VERSION|harnesses\.toml|\.[^/]+-plugin/.*\.json)$

          - id: template-drift
            name: almanac README matches the shipped template
            entry: uv run python -m tools drift
            language: system
            pass_filenames: false
            always_run: true

          - id: structural-tests
            name: structural test suite
            entry: uv run pytest
            language: system
            pass_filenames: false
            always_run: true
