# Configure pre-commit hooks
---
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-case-conflict
          - id: check-merge-conflict
          - id: trailing-whitespace

    - repo: https://github.com/rbubley/mirrors-prettier
      rev: v3.9.6
      hooks:
          - id: prettier

    - repo: local
      hooks:
          - id: plugin-manifests
            name: Claude plugin and marketplace manifests agree
            entry: scripts/check-manifests.sh
            language: system
            pass_filenames: false
            files: ^(?:VERSION|\.claude-plugin/.*\.json)$

          - id: codex-plugin-manifest
            name: Codex plugin manifest agrees
            entry: scripts/check-codex-manifest.sh
            language: system
            pass_filenames: false
            files: ^(?:VERSION|\.codex-plugin/.*)$

          - id: template-drift
            name: almanac README matches the shipped template
            entry: python3 scripts/check-template-drift.py
            language: system
            pass_filenames: false
            always_run: true
