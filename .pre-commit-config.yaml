# Configure pre-commit hooks
---
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-case-conflict
          - id: check-merge-conflict
          - id: trailing-whitespace

    - repo: https://github.com/rbubley/mirrors-prettier
      rev: v3.9.6
      hooks:
          - id: prettier

    # `tools/` is stdlib-only, so these need no environment of their own — which is
    # also why they call `python3 -m tools` rather than `just`: the CI image that runs
    # pre-commit has no `just`. One hook covers every harness in `harnesses.toml`; a
    # new harness is a row there, not another entry here.
    - repo: local
      hooks:
          - id: plugin-manifests
            name: every harness manifest agrees
            entry: python3 -m tools check-manifests
            language: system
            pass_filenames: false
            files: ^(?:VERSION|harnesses\.toml|\.[^/]+-plugin/.*\.json)$

          - id: template-drift
            name: almanac README matches the shipped template
            entry: python3 -m tools drift
            language: system
            pass_filenames: false
            always_run: true

          - id: structural-tests
            name: structural test suite
            entry: pytest
            language: python
            additional_dependencies: [pytest, pyyaml]
            pass_filenames: false
            always_run: true
