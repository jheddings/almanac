# Configure pre-commit hooks
---
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-case-conflict
          - id: check-merge-conflict
          - id: trailing-whitespace

    - repo: https://github.com/rbubley/mirrors-prettier
      rev: v3.9.6
      hooks:
          - id: prettier

    # These call `uv run` rather than `just`, since the CI image that runs pre-commit
    # has no `just` — but they use the same environment `just venv` syncs, so there is
    # one dependency declaration (pyproject.toml) rather than a second copy here.
    #
    # One hook covers every harness in `harnesses.toml`; a new harness is a row there,
    # not another entry here.
    - repo: local
      hooks:
          - id: plugin-manifests
            name: every harness manifest agrees
            entry: uv run python -m tools check-manifests
            language: system
            pass_filenames: false
            files: ^(?:VERSION|harnesses\.toml|\.[^/]+-plugin/.*\.json)$

          - id: template-drift
            name: almanac README matches the shipped template
            entry: uv run python -m tools drift
            language: system
            pass_filenames: false
            always_run: true

          - id: structural-tests
            name: structural test suite
            entry: uv run pytest
            language: system
            pass_filenames: false
            always_run: true
