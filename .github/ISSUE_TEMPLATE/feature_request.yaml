---
name: Feature Request
description: >-
    Suggest a new feature or enhancement for almanac
title: "[Feature]: "
labels: ["enhancement"]
body:
    - type: markdown
      attributes:
          value: >
              Thanks for suggesting a new feature! Please fill out the sections below to
              help us understand your idea.

    - type: textarea
      id: description
      attributes:
          label: What would you like to see?
          description: >-
              Provide a clear and concise description of the feature you'd like to see.
          placeholder: >
              Example: I would like `almanac:audit` to report how long each entry has
              gone without a passing verify, so stale facts surface before they mislead
              anyone.
      validations:
          required: true

    - type: textarea
      id: problem
      attributes:
          label: What problem does this solve?
          description: >-
              Explain the problem or need this feature would address. Help us understand
              why this is important.
          placeholder: >
              Example: An entry whose verify line has not run in months reads exactly
              like one checked yesterday. A confidently-worded stale fact is worse than
              no fact, and nothing in the current output distinguishes the two.
      validations:
          required: true

    - type: textarea
      id: desired-behavior
      attributes:
          label: Describe the desired behavior
          description: >
              Walk us through a concrete scenario showing how this feature would work.
              Include expected inputs, outputs, and any relevant state changes.
          placeholder: |
              Example:
              1. Invoke `almanac:audit`
              2. Each entry's last passing verify is read from git history
              3. Entries past a threshold are listed under `stale`
              4. The correction gate offers to re-verify them first
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Have you tried any workarounds?
          description: >-
              Are there any current workarounds you're using? What other solutions have
              you considered?
          placeholder: >
              Example: I run `almanac:audit` on a schedule and diff the output by hand
              to spot entries that stopped being touched.

    - type: textarea
      id: examples
      attributes:
          label: Examples or References
          description: >
              Are there any other tools or projects that do something similar? Feel free
              to share links or examples.
          placeholder: >
              Example: `cargo audit` marks advisories as stale once their upstream
              database entry ages past a threshold.

    - type: dropdown
      id: component
      attributes:
          label: Which component is this related to?
          description: >-
              Select the area of the system most relevant to this feature.
          options:
              - "Skill: almanac:init"
              - "Skill: almanac:record"
              - "Skill: almanac:audit"
              - Almanac contract (templates/almanac/README.md)
              - Packaging: Claude Code
              - Packaging: Codex
              - Packaging: Antigravity (agy)
              - Packaging: Cursor
              - Build tooling and scripts
              - Documentation
              - Other
      validations:
          required: true

    - type: textarea
      id: additional
      attributes:
          label: Additional Context
          description: >
              Add any other technical context, design ideas, or considerations about
              this feature request.
          placeholder: >-
              Any additional information that might be helpful.
