name: preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  style-and-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npx prettier --check .
      - name: Validate plugin manifests
        run: |
          jq -e '.name == "almanac" and (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and .license == "MIT"' .claude-plugin/plugin.json >/dev/null
          jq -e '.plugins | length == 1 and .[0].name == "almanac" and .[0].source == "./"' .claude-plugin/marketplace.json >/dev/null
          test "$(jq -r .name .claude-plugin/plugin.json)" = "$(jq -r '.plugins[0].name' .claude-plugin/marketplace.json)"
