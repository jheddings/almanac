# Run pre-commit checks
---
name: Pre-commit Checks

"on":
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    precommit_check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: actions/setup-python@v6.2.0
            # The local hooks run through `uv run`, the same way `just` does, so the
            # suite and the checks resolve one environment from pyproject.toml.
            - uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
            - uses: pre-commit/action@v3.0.1
